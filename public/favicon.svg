<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#050505"/>
  <!-- Capital T -->
  <rect x="3" y="6" width="11" height="3" fill="#D4FF00"/>
  <rect x="7" y="6" width="3" height="11" fill="#D4FF00"/>
  <!-- lowercase t -->
  <rect x="14" y="11" width="6" height="2.5" fill="#F5F5F0"/>
  <rect x="16" y="11" width="2.5" height="7" fill="#F5F5F0"/>
  <!-- dot -->
  <rect x="20" y="11" width="3" height="3" fill="#D4FF00"/>
  <rect x="23" y="11" width="1.5" height="1.5" fill="#D4FF00" opacity="0.5"/>
</svg>
