<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 32" fill="none" aria-hidden="true">
  <!-- Capital T — brand lime -->
  <rect x="2" y="4" width="18" height="5" fill="#D4FF00"/>
  <rect x="9" y="4" width="5" height="18" fill="#D4FF00"/>
  <!-- lowercase t — black -->
  <rect x="22" y="9" width="4" height="13" fill="#0A0A0A"/>
  <rect x="19" y="9" width="10" height="4" fill="#0A0A0A"/>
  <!-- pixel dot — brand lime -->
  <rect x="34" y="20" width="6" height="6" fill="#D4FF00"/>
  <rect x="40" y="20" width="2" height="2" fill="#D4FF00" opacity="0.45"/>
  <rect x="34" y="26" width="2" height="2" fill="#D4FF00" opacity="0.35"/>
</svg>
